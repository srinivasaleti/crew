<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crew</title>
<link rel="stylesheet" href="styles/theme.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/chat.css">
<link rel="stylesheet" href="styles/dialogs.css">
<link rel="stylesheet" href="styles/diff.css">
<div id="app"></div>
<script>
  // A script that fails before drawing would leave an empty, dark window: say what broke instead.
  addEventListener('error', (e) => {
    if (document.getElementById('app').children.length) return;
    document.getElementById('app').innerHTML = '<div class="empty"><div class="big">crew\'s page failed to load</div><pre class="err"></pre></div>';
    document.querySelector('#app pre').textContent = e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '');
  });
</script>
<script type="module" src="app.js"></script>
